<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lockup-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8cb0ff" />
      <stop offset="100%" stop-color="#5584ff" />
    </linearGradient>
    <linearGradient id="lockup-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#0a0b10" />
    </linearGradient>
    <filter id="lockup-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#638eff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem Tile -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#tile-bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2"/>
    <rect x="0" y="0" width="80" height="80" rx="20" fill="none" stroke="url(#lockup-blue)" stroke-width="1" opacity="0.4"/>
    
    <!-- Mini Nexus Mark inside -->
    <g transform="translate(6, 6) scale(0.68)">
      <path d="M 18 20 L 30 20 L 30 62 C 30 70 36 76 44 76 C 52 76 58 70 58 62 L 58 20 L 70 20 L 70 62 C 70 77 59 88 44 88 C 29 88 18 77 18 62 Z" fill="url(#lockup-white)"/>
      <path d="M 52 88 L 74 20 L 86 20 L 98 88 L 86 88 L 83 70 L 62 70 L 58 88 Z M 65 59 L 80 59 L 74 34 Z" fill="url(#lockup-blue)" filter="url(#lockup-glow)"/>
    </g>
  </g>

  <!-- Typography: USMAN AHMED -->
  <text x="110" y="47" fill="#ffffff" font-family="'Clash Display', -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5">
    USMAN AHMED<tspan fill="#638eff">.</tspan>
  </text>

  <!-- Subtitle: PROJECT TEAM LEAD -->
  <text x="112" y="68" fill="#8b92a5" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3" font-weight="500">
    PROJECT TEAM LEAD
  </text>
</svg>
