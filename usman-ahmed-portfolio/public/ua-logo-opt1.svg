<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nexus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141e"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>

    <!-- Platinum Gradient for U -->
    <linearGradient id="u-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d7e2"/>
    </linearGradient>

    <!-- Electric Blue Gradient for A & Accent -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8cb0ff"/>
      <stop offset="100%" stop-color="#638eff"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="nexus-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#638eff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container Box with Glass Effect -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#nexus-bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="url(#accent-grad)" stroke-width="1" opacity="0.4"/>

  <!-- Geometric Interlocking 'U' and 'A' -->
  <g transform="translate(10, 8)">
    <!-- 'U' Stem and Base (White / Platinum) -->
    <!-- Left vertical stem of U -->
    <path d="M 22 26 L 34 26 L 34 64 C 34 71 39 76 46 76 C 53 76 58 71 58 64 L 58 48 L 70 48 L 70 64 C 70 77 60 88 46 88 C 32 88 22 77 22 64 Z" 
          fill="url(#u-grad)" />

    <!-- 'A' Structure Interlocking (Electric Blue & Platinum) -->
    <!-- The Apex of A rising above U -->
    <path d="M 68 26 L 80 26 L 94 88 L 81 88 L 77 68 L 57 68 L 59 56 L 74 56 L 74 38 Z" 
          fill="url(#accent-grad)" />

    <!-- Dynamic Nexus Crossbar / Arrow Accent -->
    <path d="M 50 56 L 84 56 L 79 45 L 60 45 Z" 
          fill="#638eff" filter="url(#nexus-glow)" opacity="0.95" />

    <!-- Precision Accent Dot (Coordinates / Delivery Symbol) -->
    <circle cx="88" cy="28" r="3.5" fill="#638eff" filter="url(#nexus-glow)"/>
  </g>
</svg>
